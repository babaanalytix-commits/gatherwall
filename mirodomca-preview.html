<style>
:root{--bg:#F7F3EC;--ink:#20242b;--muted:#7b7568;--gold:#C2A058;--deep:#1c2027;--line:#e7e0d4;--card:#fffdf9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}
a{color:var(--deep)}
#welcome{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#3a3326,#14161a 75%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s}
#welcome.gone{opacity:0;pointer-events:none}
#welcome img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:5px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.5);animation:rise 1.2s ease}
#welcome .to{margin-top:26px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#e4c77a}
#welcome h1{font-family:Fraunces,serif;font-size:clamp(36px,7vw,58px);font-weight:600;line-height:1.1;margin:10px 0 8px}
#welcome p{max-width:460px;opacity:.85}
#welcome button{margin-top:28px;background:var(--gold);color:#1b1b1b;border:0;border-radius:999px;padding:15px 34px;font:600 16px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@keyframes rise{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.lgsw{position:absolute;top:12px;right:12px;z-index:60;display:flex;gap:4px}
.lgsw button{border:1px solid rgba(255,255,255,.4);background:rgba(20,22,26,.55);color:#fff;border-radius:999px;padding:5px 11px;font:600 12px Inter,sans-serif;cursor:pointer}
.lgsw button.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
.hero{position:relative;color:#fff;text-align:center;padding:60px 20px 80px;background:#14161a url(md/md-hero.jpg) center/cover}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,20,.45),rgba(15,17,20,.75))}
.hero>*{position:relative}
.hero img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--gold)}
.hero h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(32px,6vw,50px);margin-top:14px;line-height:1.1}
.hero p{opacity:.9;margin-top:6px;font-family:Fraunces,serif;font-style:italic}
.hero .dates{margin-top:14px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hero .dates span{border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 14px;font-size:13px}
nav{position:sticky;top:0;z-index:5;background:rgba(247,243,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 12px;justify-content:flex-start}
nav>:first-child{margin-left:auto}nav>:last-child{margin-right:auto}
nav a{white-space:nowrap;text-decoration:none;color:var(--deep);font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:999px}
nav a:hover{background:#ece5d8}
.wrap{max-width:780px;margin:-44px auto 0;padding:0 16px 40px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;margin-bottom:22px;box-shadow:0 6px 24px rgba(0,0,0,.05);scroll-margin-top:70px}
.num{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card h2{font-family:Fraunces,serif;font-weight:600;font-size:26px;color:var(--deep);margin:2px 0 6px}
.card .lead{color:var(--muted);margin-bottom:16px}
.video{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#111}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14.5px;border:1.5px solid var(--deep);color:var(--deep);background:#fff;cursor:pointer;font-family:inherit}
.btn.solid{background:var(--deep);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.btn small{font-weight:400;opacity:.75}
.song{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.song:first-of-type{border-top:0}
.song .n{color:var(--gold);font-weight:600}
.song b{font-family:Fraunces,serif;font-size:17px;font-weight:600}
.song span{display:block;font-size:12.5px;color:var(--muted)}
.song audio{grid-column:2/4;width:100%;height:36px}
.song .mini{font-size:13px;text-decoration:none;font-weight:600;color:var(--deep);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.grid img:nth-child(n+10){display:none}}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
.gw{max-width:780px;margin:10px auto 0;padding:0 16px 50px;text-align:center}
.gw .box{border-top:1px solid var(--line);padding-top:26px}
.gw h3{font-family:Fraunces,serif;font-weight:600;color:var(--deep);font-size:21px}
.gw p{color:var(--muted);font-size:14.5px;margin:4px auto 16px;max-width:520px}
.offers{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
@media(max-width:600px){.offers{grid-template-columns:1fr}}
.offer{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.offer b{display:block;color:var(--deep)}.offer span{font-size:13.5px;color:var(--muted)}
.offer em{display:inline-block;margin-top:8px;font-style:normal;font-weight:600;color:var(--deep);font-size:14px}
.foot{font-size:12.5px;color:var(--muted);margin-top:24px}
.grid img{filter:blur(12px) saturate(.8)}.grid{overflow:hidden;border-radius:10px}
.locked,#dlHD,#dlPhone,#dlThanks,#dlAll,#songList audio,#songList a{opacity:.4!important;pointer-events:none!important;filter:grayscale(1)}
.lockbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;background:#2a2d33;color:#fff}
.pv{background:#fff6e5;border:1px solid #f0dcb0;border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:18px}
.pvpill{position:fixed;top:10px;left:10px;z-index:60;background:#20242b;color:#fff;font:700 11px Inter,sans-serif;letter-spacing:.1em;padding:5px 10px;border-radius:999px}
#songList b,#songList span{filter:blur(5px);user-select:none}

<script>
const DRIVE = { folder:'', hd:'', phone:'', thanks:'' };
const SONGS=[['Píseň 1 · Song 1','Vaše píseň','Your song','',''] ,['Píseň 2 · Song 2','Vaše píseň','Your song','',''] ,['Píseň 3 · Song 3','Vaše píseň','Your song','',''] ,['Píseň 4 · Song 4','Vaše píseň','Your song','',''] ,['Píseň 5 · Song 5','Vaše píseň','Your song','',''] ,['Píseň 6 · Song 6','Vaše píseň','Your song','',''] ];
let L=(new URLSearchParams(location.search).get('lang')||(()=>{try{return localStorage.getItem('mdp_lang')}catch(e){return null}})()||'en'); if(L!=='cs') L='en';
function renderSongs(){ document.getElementById('songList').innerHTML=SONGS.map((s,i)=>'<div class="song"><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><b>'+s[0]+'</b><span>'+(L==='en'?s[2]:s[1])+'</span></div><div><a class="mini" href="mirodomca-song.html?s='+(i+1)+'">🎤</a> &nbsp;<a class="mini" href="'+s[3]+'" download="'+s[4]+'">⬇️ MP3</a></div><audio controls preload="none" src="'+s[3]+'"></audio></div>').join(''); }
function applyLang(l){ L=l; try{localStorage.setItem('mdp_lang',l)}catch(e){} document.documentElement.lang=l;
  document.querySelectorAll('[data-cs]').forEach(el=>{ el.textContent=el.getAttribute('data-'+l); });
  document.querySelectorAll('.lgsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===l)); renderSongs();
  document.querySelectorAll('.video .soon').forEach(e=>e.textContent=l==='en'?'The film will appear here shortly':'Film se tu brzy objeví'); }
document.querySelectorAll('.lgsw button').forEach(b=>b.onclick=()=>applyLang(b.dataset.l));
const view=id=>'https://drive.google.com/file/d/'+id+'/view';
function setLink(el,id){ const a=document.getElementById(el); if(id){ a.href=view(id);} else { a.removeAttribute('href'); a.style.opacity=.5; } }
setLink('dlHD',DRIVE.hd); setLink('dlPhone',DRIVE.phone); setLink('dlThanks',DRIVE.thanks);
(function(){ const a=document.getElementById('dlAll'); if(DRIVE.folder) a.href='https://drive.google.com/drive/folders/'+DRIVE.folder; else { a.removeAttribute('href'); a.style.opacity=.5; } })();
function embed(box,id){ document.getElementById(box).innerHTML=id?'<iframe src="https://drive.google.com/file/d/'+id+'/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>':'<div class="soon" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc"></div>'; }
document.getElementById('filmBox').innerHTML='<video src="md/md-teaser.mp4" poster="md/md-card.jpg" controls playsinline preload="metadata" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>'; document.getElementById('thanksBox').innerHTML='<div class="lockbox">🔒</div>';
function openGift(){ document.getElementById('welcome').classList.add('gone'); try{0}catch(e){} }
try{ if(0) document.getElementById('welcome').classList.add('gone'); }catch(e){}
applyLang(L);
</script>

<script>/* Keepsake pages are a sales channel: tag first-touch source so sales from guests show up as from=keepsake. Never overwrite an existing (unexpired) source. */
