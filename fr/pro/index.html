<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="canonical" href="https://gatherwall.com/fr/business.html">
<title>GatherWall Business</title>
<script>
/* Short marketing link gatherwall.com/fr/pro : picks the visitor's language (unless fixed) and tags the visit for tracking. */
(function(){
  var T={"en": "/business.html", "fr": "/fr/business.html", "es": "/es/business.html", "de": "/de/business.html", "cs": "/cs/pro-firmy.html"}, forced='fr', h='';
  var lang=forced;
  if(!lang){ var ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en']);
    for(var i=0;i<ls.length&&!lang;i++){ var c=String(ls[i]).slice(0,2).toLowerCase(); if(T[c]) lang=c; } }
  if(!lang) lang='en';
  var q=new URLSearchParams(location.search);
  if(!q.get('from')) q.set('from','link');
  if(!q.get('c')) q.set('c','pro');
  location.replace(T[lang]+'?'+q.toString()+(location.hash||h));
})();
</script></head>
<body><p><a href="/fr/business.html">GatherWall Business</a></p></body></html>
