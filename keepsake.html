<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A keepsake, just for you · GatherWall</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d1512">
<meta name="robots" content="noindex">
<meta property="og:title" content="A keepsake, just for you 💛">
<meta property="og:description" content="Someone made you a keepsake — a song and a story from a whole life of memories. Tap to open your gift.">
<meta property="og:image" content="https://gatherwall.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* ============================================================
   THE KEEPSAKE  ·  fill this in for each client, then save/host.
   Photos can be URLs (e.g. "mem1.jpg") or embedded base64 data URLs
   (data:image/jpeg;base64,...) for a fully self-contained, offline
   "yours to keep forever" file.
   ============================================================ */
window.KEEPSAKE = {
  recipient: "Mum",
  from:      "Aidan & the family",
  message:   "Happy 70th, Mum. We turned your whole story into a song — every word is true. We love you.",
  title:     "Fifty Years of Gold",
  sub:       "A life in photos & song",
  songUrl:   "fifty-years-of-gold.mp3",
  colour:    "#C2A058",
  intro:     9,
  outro:     7,
  photos:    ["mem1.jpg","mem2.jpg","mem3.jpg","mem4.jpg","mem5.jpg","mem6.jpg"],
  years:     ["1974","1996","2001","2008","2019","2026"],
  lyrics:    ["Fifty candles, one bright room","Fifty summers come and gone","Every line upon your face","Is a story, is a song","You gave us mornings, gave us light","Held the whole world through the night","Here's to fifty years of gold","To the love you gave, to the hands you'd hold","Brightest heart we've ever known","Mum, you made this house a home","Fifty years of gold","You were strong when we were small","You were brave when storms would come","Never once did you let go","Of the people you'd become","Through the laughter, through the tears","You have carried all these years","Here's to fifty years of gold","To the love you gave, to the hands you'd hold","Brightest heart we've ever known","Mum, you made this house a home","Fifty years of gold","And if we could give the world to you","We would wrap it up in gold","For every dream you set aside","For every hand you'd hold","So blow the candles, make the wish","You have earned this, every bit","Fifty years, and just begun","You're the brightest, you're the one","Here's to fifty years of gold","To the love you gave, to the stories told","Brightest heart we've ever known","Happy birthday, welcome home","Fifty years of gold","Happy birthday to you","Fifty years, and shining through"]
};
</script>
<style>
  :root{--gold:#C2A058;--ink:#F4EFE3;--muted:#c9c3b4;--bg:#0d1512;--ui:'Inter',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ui);color:var(--ink);background:radial-gradient(1100px 620px at 50% -6%,rgba(194,160,88,.16),transparent 60%),radial-gradient(800px 500px at 10% 110%,rgba(46,125,91,.10),transparent 60%),var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;text-align:center}
  .crest{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink);text-decoration:none;opacity:.85}
  .crest .dot{width:22px;height:20px;background:url("favicon.svg") center/contain no-repeat}
  .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 6px;font-weight:700}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,7vw,50px);line-height:1.08;color:var(--ink);background:linear-gradient(180deg,#F6EFDD,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px;margin-top:8px}
  .stage{position:relative;aspect-ratio:4/3;margin:26px auto 0;max-width:560px;border-radius:20px;overflow:hidden;background:#0a100e;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 90px -50px rgba(0,0,0,.9)}
  .frame{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity 1.1s ease,transform 6s ease-out;background-size:cover;background-position:center}
  .frame.show{opacity:1;transform:scale(1)}
  .year{position:absolute;left:16px;bottom:14px;font-family:var(--serif);font-size:15px;color:rgba(255,255,255,.86);text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.04em}
  .nowline{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.4;color:var(--ink);min-height:64px;display:flex;align-items:center;justify-content:center;padding:20px 10px 4px;transition:opacity .35s}
  .player{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 18px 18px;max-width:520px;margin:4px auto 0}
  .track{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .controls{display:flex;align-items:center;justify-content:center;gap:22px}
  .play{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#E7CE86,var(--gold) 60%,#9A7D33);color:#0d1512;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(194,160,88,.7)}
  .side{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--ui)}
  .bar-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted)}
  .bar{flex:1;height:5px;background:rgba(255,255,255,.14);border-radius:99px;cursor:pointer;position:relative}
  .fill{height:100%;width:0;background:var(--gold);border-radius:99px}
  .actions{margin:26px auto 0;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;border-radius:999px;padding:12px 22px;text-decoration:none;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:var(--ink)}
  .btn.gold{background:linear-gradient(120deg,#E7CE86,var(--gold));color:#0d1512;border:none;font-weight:700}
  .madeby{margin-top:30px;font-size:12.5px;color:var(--muted)}
  .madeby a{color:var(--gold);font-weight:600;text-decoration:none}
  /* GIFT REVEAL */
  #reveal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer;background:radial-gradient(900px 520px at 50% 18%,rgba(194,160,88,.22),transparent 60%),#0d1512;transition:opacity .6s}
  #reveal .card{max-width:440px;width:100%;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.15);border-radius:26px;padding:46px 30px}
  #reveal .seal{width:84px;height:84px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 35% 30%,#E7CE86,var(--gold) 55%,#9A7D33);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 16px 34px -12px rgba(154,125,51,.8)}
  #reveal .to{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--ink);margin-bottom:8px}
  #reveal .msg{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--muted);line-height:1.6;margin-bottom:24px;white-space:pre-wrap}
  #reveal .tap{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:#0d1512;background:#E7CE86;border-radius:999px;padding:14px 30px}
  #reveal .fromline{margin-top:16px;font-size:13px;color:#8a8676}
  @media print{#reveal,.player,.actions,.madeby,.crest{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="crest" href="index.html"><span class="dot"></span>GatherWall</a>
  <div class="eyebrow" id="eyebrow">A keepsake, made just for you</div>
  <h1 id="title">Fifty Years of Gold</h1>
  <div class="sub" id="sub">A life in photos &amp; song</div>

  <div class="stage" id="stage"></div>
  <div class="nowline" id="nowline">Press play to begin…</div>

  <div class="player">
    <div class="track" id="track">Composed just for them</div>
    <div class="controls">
      <button class="side" onclick="seekBy(-10)">⟲ 10</button>
      <button class="play" id="play" onclick="toggle()">▶</button>
      <button class="side" onclick="seekBy(10)">10 ⟳</button>
    </div>
    <div class="bar-row"><span id="cur">0:00</span><div class="bar" id="bar" onclick="seek(event)"><div class="fill" id="fill"></div></div><span id="dur">0:00</span></div>
  </div>

  <div class="actions">
    <button class="btn gold" onclick="downloadKeepsake()">⬇ Keep this forever</button>
    <a class="btn" id="dlSong" href="#" download>♪ Save the song</a>
  </div>

  <div class="madeby">Made with <a href="index.html">GatherWall</a> — <a href="keepsake-preview.html">make one for someone you love →</a></div>
</div>

<audio id="audio" preload="metadata"></audio>

<!-- GIFT REVEAL -->
<div id="reveal" onclick="openGift()">
  <div class="card">
    <div class="seal">💛</div>
    <div class="to" id="rvTo">For you</div>
    <div class="msg" id="rvMsg">Someone made you something.</div>
    <div class="tap">Tap to open your gift →</div>
    <div class="fromline" id="rvFrom"></div>
  </div>
</div>

<script>
var K=window.KEEPSAKE||{};
var audio=document.getElementById('audio'), stage=document.getElementById('stage'),
    nowline=document.getElementById('nowline'), playBtn=document.getElementById('play'),
    fill=document.getElementById('fill'), curEl=document.getElementById('cur'), durEl=document.getElementById('dur');
var N=(K.photos||[]).length, curFrame=-1, curLine=-1;
var INTRO=K.intro||9, OUTRO=K.outro||7;
if(K.colour){ document.documentElement.style.setProperty('--gold', K.colour); }

// header + song + reveal
document.getElementById('title').textContent = K.title||'A keepsake for you';
document.getElementById('sub').textContent = K.sub||'A life in photos & song';
document.getElementById('track').textContent = (K.title? K.title+' · ':'')+'composed just for '+(K.recipient||'you');
audio.src = K.songUrl||''; var ds=document.getElementById('dlSong'); if(K.songUrl){ ds.href=K.songUrl; } else { ds.style.display='none'; }
document.getElementById('rvTo').textContent = 'For '+(K.recipient||'you');
document.getElementById('rvMsg').textContent = K.message||'Someone made you something — a song and a story, from a whole life of memories.';
document.getElementById('rvFrom').innerHTML = K.from? 'With love, <b style="color:#cdbf99">'+esc(K.from)+'</b>' : '';
document.title = (K.recipient? K.recipient+' — ':'')+'A keepsake · GatherWall';

// build photo frames
(K.photos||[]).forEach(function(src,i){
  var f=document.createElement('div'); f.className='frame'; f.id='fr'+i;
  f.style.backgroundImage="url('"+src+"')";
  if(K.years&&K.years[i]){ var y=document.createElement('div'); y.className='year'; y.textContent=K.years[i]; f.appendChild(y); }
  stage.appendChild(f);
});
if(N){ showFrame(0); }  // show first photo immediately, before audio loads
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){s=Math.max(0,s||0);var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;}
function showFrame(i){ if(i===curFrame)return; var p=document.getElementById('fr'+curFrame); if(p)p.classList.remove('show'); var n=document.getElementById('fr'+i); if(n)n.classList.add('show'); curFrame=i; }
function setLine(t){ nowline.style.opacity=0; setTimeout(function(){ nowline.textContent=t; nowline.style.opacity=1; },170); }
function toggle(){ audio.paused?audio.play().catch(function(){}):audio.pause(); }
audio.addEventListener('play',function(){playBtn.textContent='❚❚';});
audio.addEventListener('pause',function(){playBtn.textContent='▶';});
audio.addEventListener('loadedmetadata',function(){ durEl.textContent=fmt(audio.duration); showFrame(0); });
function seek(e){ if(!audio.duration)return; var r=document.getElementById('bar').getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration; }
function seekBy(n){ audio.currentTime=Math.max(0,Math.min(audio.duration||0,audio.currentTime+n)); }
audio.addEventListener('timeupdate',function(){
  if(!audio.duration)return;
  fill.style.width=(audio.currentTime/audio.duration*100)+'%'; curEl.textContent=fmt(audio.currentTime);
  var span=Math.max(1,audio.duration-INTRO-OUTRO), prog=(audio.currentTime-INTRO)/span;
  if(N){ showFrame(Math.max(0,Math.min(N-1,Math.floor(prog*N)))); }
  var L=K.lyrics||[]; if(L.length){ var li=Math.max(0,Math.min(L.length-1,Math.floor(prog*L.length))); if(li!==curLine){ setLine(L[li]); curLine=li; } }
});
function openGift(){
  var o=document.getElementById('reveal'); o.style.opacity='0'; setTimeout(function(){o.style.display='none';},600);
  audio.play().catch(function(){});
  var s=document.getElementById('stage'); if(s){ try{ s.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} }
}
function downloadKeepsake(){
  try{
    var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var blob=new Blob([html],{type:'text/html'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=((K.recipient||'keepsake').replace(/[^a-z0-9]+/gi,'-'))+'-keepsake.html'; a.click();
  }catch(e){ alert('Right-click this page and choose “Save as…” to keep your keepsake.'); }
}
</script>
</body>
</html>
